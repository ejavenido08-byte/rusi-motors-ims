<script type="module">
  import { loginUser } from './js/auth.js';
  import { auth } from './js/firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.replace('dashboard.html');
    }
  });

  const form     = document.getElementById('login-form');
  const btnLogin = document.getElementById('btn-login');
  const errorBox = document.getElementById('login-error');
  const errorMsg = document.getElementById('login-error-msg');
  const togglePw = document.getElementById('toggle-pw');
  const pwInput  = document.getElementById('password');

  togglePw.addEventListener('click', () => {
    const isText = pwInput.type === 'text';
    pwInput.type = isText ? 'password' : 'text';
    togglePw.textContent = isText ? '👁️' : '🙈';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      errorMsg.textContent = 'Please fill in all fields.';
      errorBox.classList.add('show');
      return;
    }

    btnLogin.disabled  = true;
    btnLogin.innerHTML = '<span class="spinner"></span> Signing in…';
    errorBox.classList.remove('show');

    try {
      await loginUser(email, password);
      window.location.replace('dashboard.html');
    } catch (err) {
      let msg = 'Invalid email or password. Please try again.';
      if (err.code === 'auth/too-many-requests')     msg = 'Too many failed attempts. Try again later.';
      if (err.code === 'auth/user-not-found')         msg = 'No account found with that email.';
      if (err.code === 'auth/wrong-password')         msg = 'Incorrect password. Please try again.';
      if (err.code === 'auth/invalid-credential')     msg = 'Wrong email or password.';
      if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your internet.';

      errorMsg.textContent = msg;
      errorBox.classList.add('show');
      btnLogin.disabled  = false;
      btnLogin.innerHTML = 'Sign In';
    }
  });
</script>
